[metadata]
name = mexc-futures-engine
version = 0.1.0
description = Safe MEXC Futures execution foundation with dry-run and risk guards.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    websocket-client>=1.8.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mexc-engine = mexc_futures_engine.cli:main

